name: Build Craig APK

on:
  push:
    branches:
      - "claude/personalized-ai-assistant-ONKs5"
      - main
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # ── 3. Android SDK licences ──────────────────────────────────────────────
      #    ubuntu-latest ships with Android SDK; we just need to accept licences
      #    and make sure android-35 + the right build-tools are present.
      - name: Accept SDK licences & install SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses \
            > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ── 4. local.properties (tells Gradle where the SDK lives) ───────────────
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 5. Make gradlew executable ───────────────────────────────────────────
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # ── 6. Gradle cache (speeds up repeat builds) ────────────────────────────
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 7. Build ─────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 8. Upload APK ────────────────────────────────────────────────────────
      #    Download from: Actions tab → click the workflow run → Artifacts section
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: craig-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
